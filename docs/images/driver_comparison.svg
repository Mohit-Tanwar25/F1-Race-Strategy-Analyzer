<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0A0E17; font-family:'Inter', system-ui, sans-serif;">
  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0E131F" stroke="#232B3E" stroke-width="1"/>
  <rect x="24" y="14" width="32" height="32" rx="6" fill="#E10600"/>
  <path d="M32 23 L44 23 L44 26 L36 26 L36 28 L42 28 L42 31 L36 31 L36 37 L32 37 Z" fill="#FFFFFF"/>
  <text x="66" y="35" fill="#FFFFFF" font-size="16" font-weight="900" letter-spacing="1">F1 STRATEGY <tspan fill="#E10600">ANALYZER</tspan></text>
  
  <rect x="580" y="14" width="180" height="32" rx="6" fill="#1E2638" stroke="#00D2BE" stroke-width="1.5"/>
  <text x="440" y="35" fill="#8B949E" font-size="12" font-weight="600">RACE OVERVIEW</text>
  <text x="600" y="35" fill="#00D2BE" font-size="12" font-weight="700">HEAD-TO-HEAD</text>
  <text x="790" y="35" fill="#8B949E" font-size="12" font-weight="600">UNDERCUTS</text>
  <text x="910" y="35" fill="#8B949E" font-size="12" font-weight="600">INCIDENTS</text>

  <!-- Driver Head-to-Head Cards -->
  <!-- Driver 1: VER -->
  <g transform="translate(24, 80)">
    <rect x="0" y="0" width="566" height="210" rx="10" fill="#151B28" stroke="#232B3E"/>
    <rect x="0" y="0" width="566" height="4" rx="2" fill="#E10600"/>
    <text x="24" y="30" fill="#E10600" font-size="10" font-weight="800">DRIVER A (PRIMARY)</text>
    <text x="24" y="58" fill="#FFFFFF" font-size="20" font-weight="900" font-family="'JetBrains Mono', monospace">VER — Max Verstappen</text>
    <text x="24" y="78" fill="#94A3B8" font-size="12">Red Bull Racing • #1</text>
    
    <text x="440" y="30" fill="#94A3B8" font-size="10" font-weight="700">STRATEGY SCORE</text>
    <text x="440" y="65" fill="#FFFFFF" font-size="28" font-weight="900" font-family="'JetBrains Mono', monospace">92<tspan fill="#64748B" font-size="14">/100</tspan></text>

    <!-- Grid stats -->
    <g transform="translate(24, 95)">
      <rect x="0" y="0" width="160" height="50" rx="6" fill="#0E131F" stroke="#232B3E"/>
      <text x="14" y="20" fill="#8B949E" font-size="9" font-weight="700">START POSITION</text>
      <text x="14" y="40" fill="#FFFFFF" font-size="16" font-weight="900" font-family="'JetBrains Mono', monospace">P1 (Pole)</text>

      <rect x="175" y="0" width="160" height="50" rx="6" fill="#0E131F" stroke="#232B3E"/>
      <text x="189" y="20" fill="#8B949E" font-size="9" font-weight="700">FINISH POSITION</text>
      <text x="189" y="40" fill="#34D399" font-size="16" font-weight="900" font-family="'JetBrains Mono', monospace">P1 (Winner)</text>

      <rect x="350" y="0" width="160" height="50" rx="6" fill="#0E131F" stroke="#232B3E"/>
      <text x="364" y="20" fill="#8B949E" font-size="9" font-weight="700">NET DELTA</text>
      <text x="364" y="40" fill="#94A3B8" font-size="16" font-weight="900" font-family="'JetBrains Mono', monospace">0 pos</text>
    </g>

    <!-- Compounds -->
    <g transform="translate(24, 160)">
      <text x="0" y="15" fill="#94A3B8" font-size="10" font-weight="700">COMPOUND STRATEGY:</text>
      <rect x="135" y="2" width="75" height="20" rx="3" fill="#FF1801"/>
      <text x="142" y="16" fill="#FFFFFF" font-size="9" font-weight="800">SOFT (17L)</text>
      <text x="216" y="16" fill="#64748B" font-size="12">→</text>
      <rect x="232" y="2" width="75" height="20" rx="3" fill="#FFFFFF"/>
      <text x="240" y="16" fill="#10141E" font-size="9" font-weight="800">HARD (19L)</text>
      <text x="313" y="16" fill="#64748B" font-size="12">→</text>
      <rect x="330" y="2" width="75" height="20" rx="3" fill="#FF1801"/>
      <text x="338" y="16" fill="#FFFFFF" font-size="9" font-weight="800">SOFT (21L)</text>
    </g>
  </g>

  <!-- Driver 2: NOR -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="566" height="210" rx="10" fill="#151B28" stroke="#232B3E"/>
    <rect x="0" y="0" width="566" height="4" rx="2" fill="#00D2BE"/>
    <text x="24" y="30" fill="#00D2BE" font-size="10" font-weight="800">DRIVER B (COMPARE)</text>
    <text x="24" y="58" fill="#FFFFFF" font-size="20" font-weight="900" font-family="'JetBrains Mono', monospace">NOR — Lando Norris</text>
    <text x="24" y="78" fill="#94A3B8" font-size="12">McLaren F1 Team • #4</text>
    
    <text x="440" y="30" fill="#94A3B8" font-size="10" font-weight="700">STRATEGY SCORE</text>
    <text x="440" y="65" fill="#FFFFFF" font-size="28" font-weight="900" font-family="'JetBrains Mono', monospace">84<tspan fill="#64748B" font-size="14">/100</tspan></text>

    <!-- Grid stats -->
    <g transform="translate(24, 95)">
      <rect x="0" y="0" width="160" height="50" rx="6" fill="#0E131F" stroke="#232B3E"/>
      <text x="14" y="20" fill="#8B949E" font-size="9" font-weight="700">START POSITION</text>
      <text x="14" y="40" fill="#FFFFFF" font-size="16" font-weight="900" font-family="'JetBrains Mono', monospace">P7</text>

      <rect x="175" y="0" width="160" height="50" rx="6" fill="#0E131F" stroke="#232B3E"/>
      <text x="189" y="20" fill="#8B949E" font-size="9" font-weight="700">FINISH POSITION</text>
      <text x="189" y="40" fill="#38BDF8" font-size="16" font-weight="900" font-family="'JetBrains Mono', monospace">P6</text>

      <rect x="350" y="0" width="160" height="50" rx="6" fill="#0E131F" stroke="#232B3E"/>
      <text x="364" y="20" fill="#8B949E" font-size="9" font-weight="700">NET DELTA</text>
      <text x="364" y="40" fill="#34D399" font-size="16" font-weight="900" font-family="'JetBrains Mono', monospace">+1 pos</text>
    </g>

    <!-- Compounds -->
    <g transform="translate(24, 160)">
      <text x="0" y="15" fill="#94A3B8" font-size="10" font-weight="700">COMPOUND STRATEGY:</text>
      <rect x="135" y="2" width="75" height="20" rx="3" fill="#FF1801"/>
      <text x="142" y="16" fill="#FFFFFF" font-size="9" font-weight="800">SOFT (13L)</text>
      <text x="216" y="16" fill="#64748B" font-size="12">→</text>
      <rect x="232" y="2" width="75" height="20" rx="3" fill="#FFFFFF"/>
      <text x="240" y="16" fill="#10141E" font-size="9" font-weight="800">HARD (20L)</text>
      <text x="313" y="16" fill="#64748B" font-size="12">→</text>
      <rect x="330" y="2" width="75" height="20" rx="3" fill="#FFFFFF"/>
      <text x="338" y="16" fill="#10141E" font-size="9" font-weight="800">HARD (24L)</text>
    </g>
  </g>

  <!-- Cumulative Gap Telemetry Chart -->
  <g transform="translate(24, 305)">
    <rect x="0" y="0" width="1152" height="240" rx="10" fill="#151B28" stroke="#232B3E"/>
    <circle cx="20" cy="22" r="4" fill="#00D2BE"/>
    <text x="32" y="26" fill="#FFFFFF" font-size="12" font-weight="800">CUMULATIVE RACE GAP TELEMETRY (VER vs NOR)</text>
    <text x="32" y="42" fill="#8B949E" font-size="10">Positive area indicates VER ahead over race distance (seconds)</text>

    <!-- Chart Grid -->
    <line x1="60" y1="200" x2="1100" y2="200" stroke="#232B3E" stroke-width="1"/>
    <line x1="60" y1="130" x2="1100" y2="130" stroke="#E10600" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="1105" y="133" fill="#E10600" font-size="9" font-weight="700">0.0s Delta</text>

    <!-- Delta Area & Curve -->
    <path d="M 70 130 Q 250 110 400 95 T 700 80 T 950 65 T 1090 50 L 1090 130 L 70 130 Z" fill="rgba(0, 210, 190, 0.1)"/>
    <path d="M 70 130 Q 250 110 400 95 T 700 80 T 950 65 T 1090 50" fill="none" stroke="#00D2BE" stroke-width="3"/>
    
    <!-- Marker points -->
    <circle cx="400" cy="95" r="4" fill="#00D2BE"/>
    <text x="400" y="85" fill="#00D2BE" font-size="10" font-weight="800" font-family="'JetBrains Mono', monospace">+8.4s (Lap 20)</text>

    <circle cx="700" cy="80" r="4" fill="#00D2BE"/>
    <text x="700" y="70" fill="#00D2BE" font-size="10" font-weight="800" font-family="'JetBrains Mono', monospace">+14.2s (Lap 35)</text>

    <circle cx="1090" cy="50" r="4" fill="#00D2BE"/>
    <text x="1040" y="40" fill="#34D399" font-size="11" font-weight="900" font-family="'JetBrains Mono', monospace">+22.457s (Finish)</text>
  </g>

  <!-- Key Tactical Discrepancies -->
  <g transform="translate(24, 560)">
    <rect x="0" y="0" width="1152" height="100" rx="10" fill="#151B28" stroke="#232B3E"/>
    <text x="20" y="24" fill="#F59E0B" font-size="11" font-weight="800">KEY STRATEGIC &amp; TELEMETRY DISCREPANCIES</text>
    <circle cx="28" cy="46" r="3" fill="#00D2BE"/>
    <text x="40" y="50" fill="#CBD5E1" font-size="11">Tyre Plan variation: VER committed to Soft-Hard-Soft vs NOR executing Soft-Hard-Hard.</text>
    <circle cx="28" cy="74" r="3" fill="#00D2BE"/>
    <text x="40" y="78" fill="#CBD5E1" font-size="11">Pit Timing: VER extended Stint 1 until Lap 17 gaining +4.2s offset advantage over NOR who pitted on Lap 13.</text>
  </g>
</svg>
